<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis | Mill | S.A.M.A.V.E.S.H.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="top-bar">
    <a href="{{ url_for('equipment') }}" class="back-link">&larr; Back</a>    <span class="top-title">Mill Analysis</span>
  </nav>
  <main class="container">
    <form action="{{ url_for('calculate_mill') }}" method="POST" class="analysis-form">
      <input type="hidden" name="equipment" value="mill">
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">A</span><h3>Process Specs</h3></div>
        <div class="grid-3">
          <div class="field"><label>Mill Motor Power</label><div class="combo"><input type="number" step="any" name="power" required><select name="power_unit"><option value="" disabled selected></option><option>kW</option><option>hp</option></select></div></div>
          <div class="field"><label>Feed Size (mm)</label><input type="number" step="any" name="feed_size"></div>
          <div class="field"><label>Product Size (&mu;m)</label><input type="number" step="any" name="product_size"></div>
        </div>
        <div class="grid-3">
          <div class="field"><label>Capacity</label><div class="combo"><input type="number" step="any" name="capacity"><select name="capacity_unit">><option value="" disabled selected></option>
<option value="kg/h">kg/h</option>
<option value="kmol/hr">kmol/hr</option>
<option value="tonne/h">tonne/h</option>
<option value="lb/hr">lb/hr</option>
<option value="lb/day">lb/day</option>
<option value="ton/day">ton/day</option></select></div></div>
          <div class="field"><label>Mill Speed (RPM)</label><input type="number" step="any" name="mill_speed"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">B</span><h3>Mill Details</h3></div>
        <div class="grid-3">
          <div class="field"><label>Mill Type</label><select name="mill_type"><option value="" disabled selected></option><option>Ball Mill</option><option>Hammer Mill</option><option>Rod Mill</option><option>Pebble Mill</option><option>Jet Mill</option></select></div>
          <div class="field"><label>Lining Material</label><select name="lining_material"><option value="" disabled selected></option><option>Manganese Steel</option><option>Ceramic</option><option>Rubber</option><option>Carbon Steel</option></select></div>
        </div>
      </div>
            <div class="panel">
        <div class="panel-head"><span class="panel-tag">C</span><h3>CAPEX</h3></div>
        <div class="grid-3">
          <div class="field"><label>Equipment Purchase Cost ($)</label><input type="number" step="any" name="purchase_cost" required placeholder="e.g. 50000"></div>
          <div class="field"><label>Bare Module Factor, F<sub>BM</sub></label><input type="number" step="any" name="bare_module_factor"></div>
          <div class="field"><label>Contingency (% of CBM)</label><input type="number" step="any" name="contingency_pct"></div>
          <div class="field"><label>Working Capital (% of FCI)</label><input type="number" step="any" name="working_capital_pct"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">O</span><h3>OPEX</h3></div>
        <div class="grid-3">
          <div class="field"><label>Utility Cost ($/kWh)</label><div class="combo"><input type="number" step="any" name="utility_cost"><select name="utility_cost_unit"><option value="" disabled selected></option>
<option value="$/kWh">$/kWh</option>
<option value="$/MWh">$/MWh</option>
<option value="$/GJ">$/GJ</option>
<option value="$/lb steam">$/lb steam</option>
<option value="$/gal">$/gal</option>
<option value="$/lb">$/lb</option>
<option value="$/kg">$/kg</option></select></div></div>
          <div class="field"><label>Operating Hours (h/yr)</label><input type="number" step="any" name="operating_hours"></div>
          <div class="field"><label>Maintenance (% of TCI)</label><input type="number" step="any" name="maintenance_pct"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">F</span><h3>Financial Analysis</h3></div>
        <div class="grid-3">
          <div class="field"><label>Discount Rate (%)</label><input type="number" step="any" name="discount_rate"></div>
          <div class="field"><label>Plant Life (years)</label><input type="number" step="1" name="plant_life"></div>
          <div class="field"><label>Currency</label><select name="currency"><option value="" disabled selected></option><option value="USD">$ USD</option><option value="INR">&#x20B9; INR</option><option value="EUR">&euro; EUR</option><option value="GBP">&pound; GBP</option></select></div>
        </div>
      </div>
      <button type="submit" class="btn-run">See Results &rarr;</button>
    </form>
    <div class="action-row" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('equipment') }}" class="btn-pdf">Add Another Equipment</a>
      <a href="{{ url_for('net_capex') }}" class="btn-ghost">Proceed to Net CapEx &rarr;</a>
    </div>
  </main>
  <footer class="page-footer">    <small>&copy; 2026 The PSI Lab, IIT Kharagpur</small>
  </footer>
</body>
</html>
