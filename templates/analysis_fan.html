<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis | Fan | S.A.M.A.V.E.S.H.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="top-bar">
    <a href="{{ url_for('equipment') }}" class="back-link">&larr; Back</a>
    <img src="{{ url_for('static', filename='images/psi-lab-logo.png') }}" alt="PSI Lab" class="nav-logo">
    <span class="top-title">Fan Analysis</span>
  </nav>
  <main class="container">
    <form action="{{ url_for('calculate_fan') }}" method="POST" class="analysis-form">
      <input type="hidden" name="equipment" value="fan">
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">A</span><h3>Process Specs</h3></div>
        <div class="grid-3">
          <div class="field"><label>Power</label><div class="combo"><input type="number" step="any" name="power" required><select name="power_unit"><option value="" disabled selected></option><option>kW</option><option>hp</option></select></div></div>
          <div class="field"><label>Flow Rate</label><div class="combo"><input type="number" step="any" name="flow_rate"><select name="flow_unit">><option value="" disabled selected></option>
<option value="m3/h">m&sup3;/h</option>
<option value="kmol/hr">kmol/hr</option>
<option value="Nm3/h">Nm&sup3;/h</option>
<option value="ACFM">ft&sup3;/min (ACFM)</option></select></div></div>
          <div class="field"><label>Static Press.</label><div class="combo"><input type="number" step="any" name="static_press"><select name="press_unit">><option value="" disabled selected></option>
<option value="bar">bar</option>
<option value="barg">barg</option>
<option value="kPa">kPa</option>
<option value="MPa">MPa</option>
<option value="Pa">Pa</option>
<option value="psi">psi</option>
<option value="psia">psia</option>
<option value="psig">psig</option>
<option value="torr">torr</option>
<option value="mmWG">mmWG</option></select></div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">B</span><h3>Fan Details</h3></div>
        <div class="grid-3">
          <div class="field"><label>Fan Type</label><select name="fan_type"><option value="" disabled selected></option><option>Centrifugal</option><option>Axial</option><option>Crossflow</option></select></div>
          <div class="field"><label>Material</label><select name="fan_material"><option value="" disabled selected></option><option>Carbon Steel</option><option>SS304</option><option>Aluminium</option></select></div>
        </div>
      </div>
            <div class="panel">
        <div class="panel-head"><span class="panel-tag">C</span><h3>CAPEX</h3></div>
        <div class="grid-3">
          <div class="field"><label>Equipment Purchase Cost ($)</label><input type="number" step="any" name="purchase_cost" required placeholder="e.g. 50000"></div>
          <div class="field"><label>Bare Module Factor, F<sub>BM</sub></label><input type="number" step="any" name="bare_module_factor"></div>
          <div class="field"><label>Contingency (% of CBM)</label><input type="number" step="any" name="contingency_pct"></div>
          <div class="field"><label>Working Capital (% of FCI)</label><input type="number" step="any" name="working_capital_pct"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">O</span><h3>OPEX</h3></div>
        <div class="grid-3">
          <div class="field"><label>Utility Cost ($/kWh)</label><div class="combo"><input type="number" step="any" name="utility_cost"><select name="utility_cost_unit"><option value="" disabled selected></option>
<option value="$/kWh">$/kWh</option>
<option value="$/MWh">$/MWh</option>
<option value="$/GJ">$/GJ</option>
<option value="$/lb steam">$/lb steam</option>
<option value="$/gal">$/gal</option>
<option value="$/lb">$/lb</option>
<option value="$/kg">$/kg</option></select></div></div>
          <div class="field"><label>Operating Hours (h/yr)</label><input type="number" step="any" name="operating_hours"></div>
          <div class="field"><label>Maintenance (% of TCI)</label><input type="number" step="any" name="maintenance_pct"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">F</span><h3>Financial Analysis</h3></div>
        <div class="grid-3">
          <div class="field"><label>Discount Rate (%)</label><input type="number" step="any" name="discount_rate"></div>
          <div class="field"><label>Plant Life (years)</label><input type="number" step="1" name="plant_life"></div>
          <div class="field"><label>Currency</label><select name="currency"><option value="" disabled selected></option><option value="USD">$ USD</option><option value="INR">&#x20B9; INR</option><option value="EUR">&euro; EUR</option><option value="GBP">&pound; GBP</option></select></div>
        </div>
      </div>
      <button type="submit" class="btn-run">See Results &rarr;</button>
    </form>
    <div class="action-row" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('equipment') }}" class="btn-pdf">Add Another Equipment</a>
      <a href="{{ url_for('net_capex') }}" class="btn-ghost">Proceed to Net CapEx &rarr;</a>
    </div>
  </main>
  <footer class="page-footer">
    <img src="{{ url_for('static', filename='images/psi-lab-logo.png') }}" alt="PSI Lab" class="footer-logo">
    <small>&copy; 2026 The PSI Lab, IIT Kharagpur</small>
  </footer>
</body>
</html>
