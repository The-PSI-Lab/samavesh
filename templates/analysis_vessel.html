<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis | Pressure Vessel | S.A.M.A.V.E.S.H.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="top-bar">
    <a href="{{ url_for('equipment') }}" class="back-link">&#8592; Back</a>    <span class="top-title">Pressure Vessel Analysis</span>
  </nav>
  <main class="container">
    <form action="{{ url_for('calculate_vessel') }}" method="POST" class="analysis-form">
      <input type="hidden" name="equipment" value="pressure_vessel">
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">A</span><h3>Process Specs</h3></div>
        <div class="grid-3">
          <div class="field">
            <label>Vessel Volume</label>
            <div class="combo">
              <input type="number" step="any" name="vessel_volume" required>
              <select name="volume_unit">><option value="" disabled selected></option>
<option value="m3">m&sup3;</option>
<option value="L">L</option>
<option value="gal">gal</option>
<option value="ft3">ft&sup3;</option></select>
            </div>
          </div>
          <div class="field">
            <label>Design Pressure</label>
            <div class="combo">
              <input type="number" step="any" name="design_pressure">
              <select name="pressure_unit">><option value="" disabled selected></option>
<option value="bar">bar</option>
<option value="barg">barg</option>
<option value="kPa">kPa</option>
<option value="MPa">MPa</option>
<option value="Pa">Pa</option>
<option value="psi">psi</option>
<option value="psia">psia</option>
<option value="psig">psig</option>
<option value="torr">torr</option>
<option value="mmWG">mmWG</option></select>
            </div>
          </div>
          <div class="field">
            <label>Design Temp</label>
            <div class="combo">
              <input type="number" step="any" name="design_temp">
              <select name="temp_unit">><option value="" disabled selected></option>
<option value="degC">&deg;C</option>
<option value="degF">&deg;F</option>
<option value="R">&deg;R</option></select>
            </div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">B</span><h3>Vessel Details</h3></div>
        <div class="grid-3">
          <div class="field">
            <label>Vessel Type</label>
            <select name="vessel_type">
              <option value="" disabled selected></option>
              <option>Horizontal</option><option>Vertical</option><option>Spherical</option>
            </select>
          </div>
          <div class="field">
            <label>Diameter</label>
            <div class="combo">
              <input type="number" step="any" name="vessel_diameter">
              <select name="diameter_unit">><option value="" disabled selected></option>
<option value="m">m</option>
<option value="mm">mm</option>
<option value="cm">cm</option>
<option value="in">in</option>
<option value="ft">ft</option></select>
            </div>
          </div>
          <div class="field">
            <label>Length / Height</label>
            <div class="combo">
              <input type="number" step="any" name="vessel_length">
              <select name="length_unit">><option value="" disabled selected></option>
<option value="m">m</option>
<option value="mm">mm</option>
<option value="cm">cm</option>
<option value="in">in</option>
<option value="ft">ft</option></select>
            </div>
          </div>
        </div>
        <div class="grid-3">
          <div class="field">
            <label>Material</label>
            <select name="vessel_material">
              <option value="" disabled selected></option>
              <option>Carbon Steel</option><option>SS304</option><option>SS316</option>
            </select>
          </div>
        </div>
      </div>
            <div class="panel">
        <div class="panel-head"><span class="panel-tag">C</span><h3>CAPEX</h3></div>
        <div class="grid-3">
          <div class="field">
            <label>Equipment Purchase Cost ($)</label>
            <input type="number" step="any" name="purchase_cost" required placeholder="e.g. 50000">
          </div>
          <div class="field">
            <label>Bare Module Factor, F<sub>BM</sub></label>
            <input type="number" step="any" name="bare_module_factor">
          </div>
          <div class="field">
            <label>Contingency (% of CBM)</label>
            <input type="number" step="any" name="contingency_pct">
          </div>
          <div class="field">
            <label>Working Capital (% of FCI)</label>
            <input type="number" step="any" name="working_capital_pct">
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">O</span><h3>OPEX</h3></div>
        <div class="grid-3">
          <div class="field">
            <label>Utility Cost ($/kWh)</label>
            <div class="combo">
              <input type="number" step="any" name="utility_cost">
              <select name="utility_cost_unit"><option value="" disabled selected></option>
<option value="$/kWh">$/kWh</option>
<option value="$/MWh">$/MWh</option>
<option value="$/GJ">$/GJ</option>
<option value="$/lb steam">$/lb steam</option>
<option value="$/gal">$/gal</option>
<option value="$/lb">$/lb</option>
<option value="$/kg">$/kg</option></select>
            </div>
          </div>
          <div class="field">
            <label>Operating Hours (h/yr)</label>
            <input type="number" step="any" name="operating_hours">
          </div>
          <div class="field">
            <label>Maintenance (% of TCI)</label>
            <input type="number" step="any" name="maintenance_pct">
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="panel-tag">F</span><h3>Financial Analysis</h3></div>
        <div class="grid-3">
          <div class="field">
            <label>Discount Rate (%)</label>
            <input type="number" step="any" name="discount_rate">
          </div>
          <div class="field">
            <label>Plant Life (years)</label>
            <input type="number" step="1" name="plant_life">
          </div>
          <div class="field">
            <label>Currency</label>
            <select name="currency">
              <option value="" disabled selected></option>
              <option value="USD">$ USD</option>
              <option value="INR">&#x20B9; INR</option>
              <option value="EUR">&euro; EUR</option>
              <option value="GBP">&pound; GBP</option>
            </select>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-run">See Results &rarr;</button>
    </form>
    <div class="action-row" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('equipment') }}" class="btn-pdf">Add Another Equipment</a>
      <a href="{{ url_for('net_capex') }}" class="btn-ghost">Proceed to Net CapEx &rarr;</a>
    </div>
  </main>
  <footer class="page-footer">    <small>&copy; 2026 The PSI Lab, IIT Kharagpur</small>
  </footer>
</body>
</html>
